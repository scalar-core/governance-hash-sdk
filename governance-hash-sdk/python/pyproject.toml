[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "governance-hash-sdk"
version = "0.1.0"
description = "Cryptographic signing SDK for AI agent workflows — SHA-256 governance hashing"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "SCALAR OS", email = "sdk@scalar-os.com"}]
keywords = ["governance", "ai", "agents", "sha256", "hash", "langchain", "crewai", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
crewai = ["crewai>=0.1.0"]

[project.urls]
Homepage = "https://scalar-os.com"
Repository = "https://github.com/scalar-os/governance-hash-sdk"
